services:
  api:
    build: .
    container_name: CHANGE_APP_NAME
    ports:
      - "8080:8080"

      ## Saves all environment variables in a .env file. Makes it easier to manage
    env_file:
    - .env
    environment:
      - CHANGE_NAME_DB_DSN=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DATABASE_NAME}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  db:
    image: "postgres:latest"
    ports:
      - "3432:5432"
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DATABASE_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  
volumes:
  pgdata: