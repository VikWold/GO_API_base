services:
  api:
    build: .
    container_name: API_NAME
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: "postgres:latest"
    ports:
      - "3432:5432"
    environment:
      - POSTGRES_USER=
      - POSTGRES_PASSWORD=
      - POSTGRES_DB=
    vlolumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  
volumes:
  pgdata: